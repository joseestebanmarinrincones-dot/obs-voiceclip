name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pyaudiowpatch vosk

      - name: Construir helper
        shell: pwsh
        run: ./tools/build_helper.ps1

      - name: Empaquetar release
        shell: pwsh
        run: ./tools/package.ps1

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/obs-voiceclip-v*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
